<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chat Room - Chatversa</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --subtext-color: #64748b;
            --card-bg: #f1f5f9;
            --header-bg: #ffffff;
            --input-bg: #ffffff;
            --border-color: #e2e8f0;
            --msg-sent: #e2e8f0;
            --msg-received: #ffffff;
            --sheet-bg: #ffffff;
            --sheet-text: #1e293b;
            --sheet-subtext: #64748b;
            --hover-bg: rgba(0, 0, 0, 0.04);
            --icon-bg: #f1f5f9;
            --modal-bg: #ffffff;
            --base-font-size: 14px;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --subtext-color: #94a3b8;
            --card-bg: #1e293b;
            --header-bg: #0f172a;
            --input-bg: #1e293b;
            --border-color: #334155;
            --msg-sent: #334155;
            --msg-received: #1e293b;
            --sheet-bg: #1e293b;
            --sheet-text: #f8fafc;
            --sheet-subtext: #94a3b8;
            --hover-bg: rgba(255, 255, 255, 0.05);
            --icon-bg: #334155;
            --modal-bg: #1e293b;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            transition: background 0.3s ease;
        }

        .chat-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 100dvh;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (min-height: 600px) and (min-width: 480px) {
            .chat-container {
                height: 90vh;
                border-radius: 28px;
                box-shadow: 0 20px 40px rgba(0,0,0,0.08);
                border: 1px solid var(--border-color);
            }
        }

        .chat-header {
            padding: 14px 18px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-right-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .call-btn-icon {
            font-size: 18px;
            cursor: pointer;
            color: var(--text-color);
            background: transparent;
            border: none;
        }

        .back-icon {
            font-size: 20px;
            color: var(--text-color);
            text-decoration: none;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #334155;
            background-size: cover;
            background-position: center;
        }

        .user-details h3 {
            font-size: 16px;
            color: var(--text-color);
            font-weight: 700;
        }

        .messages-area {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            overscroll-behavior-y: contain;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .date-divider {
            align-self: center;
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 8px 0;
        }

        .msg-bubble {
            max-width: 80%;
            padding: 10px 16px;
            border-radius: 18px;
            font-size: var(--base-font-size);
            color: var(--text-color);
            line-height: 1.4;
            word-break: break-word;
        }

        .msg-sent {
            align-self: flex-end;
            background: var(--msg-sent);
        }

        .msg-received {
            align-self: flex-start;
            background: var(--msg-received);
            border: 1px solid var(--border-color);
        }

        /* SNAPCHAT CARD STYLING */
        .snap-card-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            margin: 4px 0;
        }

        .snap-card-wrapper.sent { align-items: flex-end; }
        .snap-card-wrapper.received { align-items: flex-start; }

        .snap-card {
            width: 90%;
            max-width: 320px;
            background: #ffffff;
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            user-select: none;
        }

        .snap-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
        }

        .snap-card.sent::before { background: #fffc00; background-color: #e11d48; }
        .snap-card.received::before { background: #0284c7; }

        .snap-card-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .snap-card-text {
            font-size: 16px;
            font-weight: 600;
            color: #0f172a;
        }

        /* SNAPCHAT CHAT INPUT BAR */
        .snap-chat-bar-container {
            position: relative;
            width: 100%;
            flex-shrink: 0;
            background: #ffffff;
        }

        .snap-chat-bar {
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid #f1f5f9;
        }

        .snap-cam-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #000000;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .snap-cam-btn svg { width: 20px; height: 20px; fill: #ffffff; }

        .snap-pill-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            border: 1.5px solid #d1d5db;
            border-radius: 26px;
            padding: 0 14px;
            height: 40px;
            background: #ffffff;
        }

        .snap-pill-input {
            width: 100%;
            border: none;
            background: transparent;
            outline: none;
            font-size: 15px;
            color: #000000;
            font-family: inherit;
        }

        .snap-action-btn, .snap-icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e293b;
            padding: 2px;
            flex-shrink: 0;
        }

        .snap-icon-btn svg, .snap-action-btn svg { width: 24px; height: 24px; fill: currentColor; }

        /* FULLSCREEN CAMERA & VIEWER */
        .snap-full-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100dvh;
            background: #000000;
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .snap-video-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
        }

        .snap-camera-controls {
            position: absolute;
            bottom: 40px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10000;
        }

        .snap-shutter-btn {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            border: 5px solid #ffffff;
            background: transparent;
            cursor: pointer;
        }

        .snap-review-actions {
            position: absolute;
            bottom: 30px;
            width: 90%;
            display: flex;
            justify-content: space-between;
            z-index: 10000;
        }

        .snap-review-btn {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .snap-send-btn { background: #e11d48; color: white; }

        #chatGalleryInput { display: none; }
    </style>
</head>
<body>

    <div class="chat-container">
        
        <div class="chat-header">
            <div class="header-left">
                <a href="#" class="back-icon">❮</a>
                <div class="avatar" id="headerAvatar">👤</div>
                <div class="user-details">
                    <h3 id="userName">krishan</h3>
                </div>
            </div>
            
            <div class="header-right-actions">
                <button class="call-btn-icon">📞</button>
                <button class="call-btn-icon">📹</button>
            </div>
        </div>

        <div class="messages-area" id="messagesArea">
            <div class="date-divider">YESTERDAY</div>
            
            <!-- SENT SNAP CARD -->
            <div class="snap-card-wrapper sent">
                <div class="snap-card sent">
                    <div class="snap-card-icon">
                        <!-- Filled Red Arrow -->
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="#e11d48">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </div>
                    <span class="snap-card-text">Delivered</span>
                </div>
            </div>

            <div class="date-divider">TODAY</div>

            <!-- RECEIVED SNAP CARD -->
            <div class="snap-card-wrapper received">
                <div class="snap-card received" onclick="openReceivedSnap(this)">
                    <div class="snap-card-icon">
                        <!-- Filled Red Rounded Square -->
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="#e11d48">
                            <rect x="3" y="3" width="18" height="18" rx="5" ry="5"/>
                        </svg>
                    </div>
                    <span class="snap-card-text">Tap to view</span>
                </div>
            </div>
        </div>

        <div class="snap-chat-bar-container">
            <div class="snap-chat-bar">
                <button class="snap-cam-btn" onclick="openSnapCamera()">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"/>
                        <path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5 5z"/>
                    </svg>
                </button>

                <div class="snap-pill-wrapper">
                    <input type="text" id="msgInput" class="snap-pill-input" placeholder="Send chat" onkeypress="handleKey(event)">
                </div>

                <button class="snap-icon-btn" onclick="document.getElementById('chatGalleryInput').click()">
                    <svg viewBox="0 0 24 24">
                        <path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12zm-2.5-7l-2.5 3.01L13.5 9l-3 4h10z"/>
                    </svg>
                </button>
            </div>
        </div>

        <input type="file" id="chatGalleryInput" accept="image/*" onchange="sendGallerySnap(event)">

    </div>

    <!-- CAMERA SCREEN -->
    <div id="snapCamScreen" class="snap-full-screen">
        <video id="snapVideo" class="snap-video-preview" autoplay playsinline></video>
        <div class="snap-camera-controls">
            <button class="snap-review-btn" onclick="closeSnapCamera()">❌ Close</button>
            <button class="snap-shutter-btn" onclick="takeSnap()"></button>
            <div style="width:70px;"></div>
        </div>
    </div>

    <!-- REVIEW SCREEN -->
    <div id="snapReviewScreen" class="snap-full-screen">
        <img id="snapPreviewImg" class="snap-video-preview">
        <div class="snap-review-actions">
            <button class="snap-review-btn" onclick="discardSnap()">🗑️ Retake</button>
            <button class="snap-review-btn snap-send-btn" onclick="sendSnapToChat()">🚀 Send Snap</button>
        </div>
    </div>

    <!-- SNAP VIEWER SCREEN -->
    <div id="snapViewerScreen" class="snap-full-screen" onclick="closeSnapViewer()">
        <img id="snapFullImg" class="snap-video-preview">
    </div>

    <script>
        let currentSnapData = null;
        const videoElem = document.getElementById('snapVideo');

        function scrollToBottom() {
            const area = document.getElementById('messagesArea');
            area.scrollTop = area.scrollHeight;
        }

        async function openSnapCamera() {
            document.getElementById('snapCamScreen').style.display = 'flex';
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                videoElem.srcObject = stream;
            } catch (err) {
                alert('Unable to access camera');
                closeSnapCamera();
            }
        }

        function closeSnapCamera() {
            if (videoElem.srcObject) {
                videoElem.srcObject.getTracks().forEach(track => track.stop());
            }
            document.getElementById('snapCamScreen').style.display = 'none';
        }

        function takeSnap() {
            const canvas = document.createElement('canvas');
            canvas.width = videoElem.videoWidth || 640;
            canvas.height = videoElem.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoElem, 0, 0, canvas.width, canvas.height);
            
            currentSnapData = canvas.toDataURL('image/png');
            document.getElementById('snapPreviewImg').src = currentSnapData;
            
            closeSnapCamera();
            document.getElementById('snapReviewScreen').style.display = 'flex';
        }

        function discardSnap() {
            currentSnapData = null;
            document.getElementById('snapReviewScreen').style.display = 'none';
            openSnapCamera();
        }

        function sendSnapToChat() {
            if (!currentSnapData) return;
            appendSentSnapCard(currentSnapData);
            document.getElementById('snapReviewScreen').style.display = 'none';
            currentSnapData = null;
            scrollToBottom();
        }

        function sendGallerySnap(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    appendSentSnapCard(event.target.result);
                    scrollToBottom();
                };
                reader.readAsDataURL(file);
            }
        }

        function appendSentSnapCard(imgData) {
            const area = document.getElementById('messagesArea');
            area.innerHTML += `
                <div class="snap-card-wrapper sent">
                    <div class="snap-card sent" onclick="viewSnap('${imgData}')">
                        <div class="snap-card-icon">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="#e11d48">
                                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                            </svg>
                        </div>
                        <span class="snap-card-text">Delivered</span>
                    </div>
                </div>
            `;
        }

        function openReceivedSnap(cardElem) {
            // Demo image overlay or view image
            viewSnap('https://via.placeholder.com/600x1000/e11d48/ffffff?text=New+Snap');
            cardElem.querySelector('.snap-card-text').innerText = 'Opened';
            cardElem.querySelector('.snap-card-icon').innerHTML = `
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#e11d48" stroke-width="2.5">
                    <rect x="3" y="3" width="18" height="18" rx="5" ry="5"/>
                </svg>
            `;
        }

        function viewSnap(url) {
            document.getElementById('snapFullImg').src = url;
            document.getElementById('snapViewerScreen').style.display = 'flex';
        }

        function closeSnapViewer() {
            document.getElementById('snapViewerScreen').style.display = 'none';
        }

        function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (text !== '') {
                const area = document.getElementById('messagesArea');
                area.innerHTML += `<div class="msg-bubble msg-sent">${text}</div>`;
                input.value = '';
                scrollToBottom();
            }
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
