<!DOCTYPE html>
<html lang="en">
<head>

padding:0;
box-sizing:border-box;

}

body{
background:#0f172a;
color:white;
}

.header{

padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
box-shadow:0 5px 15px rgba(0,0,0,.35);

cursor:pointer;
transition:.3s;

}

.card:hover{
transform:translateY(-4px);

}

</style>
</head>

<div class="header">
▶️ Chatversa Play
</div>

<div class="menu">

</div>

<div class="card"

🎥 Videos
</div>

<div class="card"

</div>

</div>

</html>
