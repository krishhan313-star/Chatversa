<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Room - Chatversa</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-user-select: none;
  user-select: none;
}

body{
  background:#0f172a;
  color:white;
  height: 100vh;
  height: 100dvh; /* Dynamic Height Fix for Chrome Mobile */
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position: fixed;
  width: 100%;
  top: 0;
  left: 0;
}

/* Header */
.header{
  background:#1e293b;
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 4px 12px rgba(0,0,0,.35);
  z-index:10;
  flex-shrink: 0;
}

.user-info{
  display:flex;
  align-items:center;
  gap:12px;
}

.back-icon{
  font-size:22px;
  cursor:pointer;
  text-decoration:none;
  color:white;
  font-weight:bold;
}

.profile-pic {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  object-fit: cover;
  background: #334155;
  border: 1.5px solid #6366f1;
}

.user-details {
  display: flex;
  flex-direction: column;
}

.user-title{
  font-size:16px;
  font-weight:bold;
}

.status-text{
  font-size:12px;
  color:#94a3b8;
}

.status-online{
  color:#22c55e;
}

.call-actions{
  display:flex;
  gap:8px;
  align-items:center;
}

.call-btn{
  background:transparent;
  border:none;
  color:white;
  cursor:pointer;
  font-size:18px;
  padding:6px;
  transition:0.2s;
}

.call-btn:hover{
  opacity:0.8;
}

/* Chat Messages Area */
.chat-box{
  flex:1;
  min-height: 0;
  padding:20px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:12px;
  z-index: 1;
}

.message{
  max-width:75%;
  padding:12px 16px;
  border-radius:18px;
  font-size:15px;
  line-height:1.4;
  word-wrap:break-word;
  -webkit-user-select: text;
  user-select: text;
}

.my-msg{
  align-self:flex-end;
  background:#6366f1;
  color:white;
  border-bottom-right-radius:4px;
}

.other-msg{
  align-self:flex-start;
  background:#1e293b;
  color:#e2e8f0;
  border-bottom-left-radius:4px;
}

.call-log-msg {
  font-size: 13px !important;
  border-radius: 12px !important;
  padding: 8px 14px !important;
}

.clickable-call-log {
  cursor: pointer;
}

/* SNAPCHAT SNAP BUTTON IN CHAT */
.snap-msg-btn {
  background: #ef4444 !important;
  color: white !important;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  border: none;
  border-radius: 14px;
  padding: 10px 16px;
  font-size: 14px;
  box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
}

/* LIVE CAMERA OVERLAY FOR SNAP */
.camera-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: #000;
  z-index: 99999;
  display: none;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: 40px 20px;
}

#cameraFeed {
  width: 100%;
  height: 70vh;
  object-fit: cover;
  border-radius: 20px;
  background: #1e293b;
}

#capturedCanvas {
  display: none;
  width: 100%;
  height: 70vh;
  object-fit: cover;
  border-radius: 20px;
}

.camera-controls {
  display: flex;
  width: 100%;
  justify-content: space-around;
  align-items: center;
}

.snap-shutter-btn {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  border: 4px solid white;
  background: transparent;
  cursor: pointer;
}

.view-mode-selector {
  display: none;
  gap: 12px;
  margin-bottom: 10px;
}

.view-chip {
  background: #334155;
  color: white;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  border: 1.5px solid transparent;
}

.view-chip.active {
  background: #6366f1;
  border-color: white;
}

/* FULLSCREEN SNAP VIEWER OVERLAY */
.snap-viewer-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: #000;
  z-index: 99999;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.snap-viewer-overlay img {
  max-width: 100%;
  max-height: 85vh;
  object-fit: contain;
  border-radius: 8px;
}

.snap-timer-badge {
  position: absolute;
  top: 30px;
  right: 30px;
  background: rgba(255,255,255,0.2);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: bold;
}

/* CHATVERSA INPUT BAR */
.input-container{
  background:#0f172a;
  padding:10px 12px;
  display:flex;
  gap:8px;
  align-items:center;
  flex-shrink: 0;
  z-index: 10;
  position: relative;
}

.plus-btn {
  background: #1e293b;
  border: none;
  color: #94a3b8;
  font-size: 22px;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.2s, color 0.2s;
}

.plus-btn:hover {
  background: #334155;
  color: white;
}

.plus-menu {
  position: absolute;
  bottom: 60px;
  left: 12px;
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 16px;
  padding: 8px 0;
  display: none;
  flex-direction: column;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  z-index: 20;
  min-width: 190px;
}

.plus-menu-item {
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  color: white;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.2s;
}

.plus-menu-item:hover {
  background: #334155;
}

.chat-input-wrapper {
  flex: 1;
  display: flex;
  align-items: center;
  background: #1e293b;
  border-radius: 24px;
  padding: 2px 14px;
  border: 1px solid #334155;
}

.message-input{
  flex:1;
  padding:10px 4px;
  border:none;
  background: transparent;
  color:white;
  font-size:15px;
  outline:none;
  -webkit-user-select: text;
  user-select: text;
}

.camera-btn {
  background: transparent;
  border: none;
  color: #94a3b8;
  font-size: 18px;
  cursor: pointer;
  padding: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.2s;
}

.camera-btn:hover {
  color: white;
}

.dynamic-action-btn {
  background: #334155;
  color: white;
  border: none;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.25s ease, transform 0.1s ease;
}

.dynamic-action-btn.is-typing {
  background: #6366f1;
}

.dynamic-action-btn:active {
  transform: scale(0.92);
}

/* CALL MODAL */
.call-modal{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  background:#0a0a0c;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  z-index:9999;
  padding:50px 20px 40px;
}

.call-bg-blur {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  filter: blur(40px) brightness(0.3);
  z-index: 1;
}

.call-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

.call-avatar {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid rgba(255,255,255,0.2);
  z-index: 2;
  position: relative;
}

.call-user-name {
  font-size: 24px;
  font-weight: 700;
  margin-top: 20px;
}

.call-status-label {
  font-size: 14px;
  color: #a1a1aa;
  margin-top: 6px;
}

.call-timer {
  font-size: 14px;
  color: #22c55e;
  margin-top: 6px;
  font-weight: 600;
  display: none;
}

.video-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  display: none;
}

#remoteVideo {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#localVideo {
  position: absolute;
  top: 40px;
  right: 20px;
  width: 110px;
  height: 160px;
  border-radius: 16px;
  object-fit: cover;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.2);
  z-index: 3;
}

.call-controls {
  position: relative;
  z-index: 5;
  display: flex;
  gap: 20px;
  align-items: center;
  background: rgba(255, 255, 255, 0.1);
  padding: 12px 28px;
  border-radius: 40px;
  backdrop-filter: blur(20px);
}

.icon-btn {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: none;
  background: rgba(255, 255, 255, 0.2);
  color: white;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.btn-end { background: #ef4444 !important; color: white !important; }
.btn-accept { background: #22c55e !important; color: white !important; }
</style>
</head>

<body>

<!-- LIVE CAMERA OVERLAY FOR REAL SNAP -->
<div class="camera-overlay" id="cameraOverlay">
  <video id="cameraFeed" autoplay playsinline></video>
  <canvas id="capturedCanvas"></canvas>

  <div class="view-mode-selector" id="viewModeSelector">
    <div class="view-chip active" id="chip1x" onclick="selectLimit(1)">1x View Once</div>
    <div class="view-chip" id="chip2x" onclick="selectLimit(2)">2x View Twice</div>
  </div>

  <div class="camera-controls">
    <button style="background:none; border:none; color:white; font-size:24px;" id="closeCamBtn">❌</button>
    <button class="snap-shutter-btn" id="shutterBtn"></button>
    <button style="background:none; border:none; color:white; font-size:24px; display:none;" id="sendSnapBtn">🚀</button>
  </div>
</div>

<!-- Fullscreen Snap Viewer Overlay -->
<div class="snap-viewer-overlay" id="snapViewerOverlay">
  <div class="snap-timer-badge" id="snapTimerBadge">5s</div>
  <img id="snapImageViewer" src="" alt="View Snap">
</div>

<!-- Header (Theme Button Removed) -->
<div class="header">
  <div class="user-info">
    <a href="javascript:history.back()" class="back-icon">←</a>
    <img id="userAvatar" class="profile-pic" src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff" alt="Profile">
    <div class="user-details">
      <div class="user-title" id="chatUserName">Loading...</div>
      <div class="status-text" id="userStatus">Offline</div>
    </div>
  </div>
  <div class="call-actions">
    <button class="call-btn" id="audioCallBtn" title="Audio Call">📞</button>
    <button class="call-btn" id="videoCallBtn" title="Video Call">📹</button>
  </div>
</div>

<!-- Hidden File Inputs -->
<input type="file" id="pictureInput" accept="image/*" style="display:none;">
<input type="file" id="documentInput" accept=".pdf,.doc,.docx,.txt" style="display:none;">

<!-- Chat Messages Area -->
<div class="chat-box" id="chatBox"></div>

<!-- CHATVERSA INPUT BAR -->
<form id="messageForm" class="input-container">
  
  <!-- WhatsApp Style Plus Button -->
  <button type="button" class="plus-btn" id="plusBtn" title="Attachments">+</button>

  <!-- Popup Menu for Plus Options -->
  <div class="plus-menu" id="plusMenu">
    <div class="plus-menu-item" id="optionEmoji"><span>😃</span> Emoji & Stickers</div>
    <div class="plus-menu-item" id="optionPicture"><span>🖼️</span> Pictures</div>
    <div class="plus-menu-item" id="optionDocument"><span>📄</span> Documents</div>
    <div class="plus-menu-item" id="optionLocation"><span>📍</span> Location</div>
  </div>

  <!-- Capsule Input Box -->
  <div class="chat-input-wrapper">
    <input type="text" id="messageInput" class="message-input" placeholder="Message..." autocomplete="off">
    <!-- Camera Icon Inside Right Edge for Live Snap -->
    <button type="button" class="camera-btn" id="cameraBtn" title="Open Camera">📷</button>
  </div>

  <!-- Dynamic Mic / Paper Plane Button -->
  <button type="submit" class="dynamic-action-btn" id="actionBtn" title="Voice Note">🎤</button>
</form>

<!-- CALL MODAL -->
<div class="call-modal" id="callModal">
  <div class="call-bg-blur" id="callBgBlur"></div>

  <div class="video-container" id="videoContainer">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
  </div>

  <div class="call-content" id="callContent">
    <div class="call-avatar-wrapper">
      <img id="callUserAvatar" class="call-avatar" src="https://ui-avatars.com/api/?name=User" alt="Avatar">
    </div>
    <div class="call-user-name" id="callUserName">User</div>
    <div class="call-status-label" id="callStatusLabel">Ringing...</div>
    <div class="call-timer" id="callTimer">00:00</div>
  </div>

  <div class="call-controls">
    <button class="icon-btn" id="toggleMicBtn">🎙️</button>
    <button class="icon-btn btn-accept" id="acceptCallBtn" style="display:none;">📞</button>
    <button class="icon-btn" id="toggleCamBtn" style="display:none;">📹</button>
    <button class="icon-btn btn-end" id="endCallBtn">❌</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {
  getFirestore,
  collection,
  doc,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  updateDoc,
  setDoc,
  deleteDoc,
  getDocs,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDe3ahkE9wEpUOYwt8dnUiFhUAYI1X3i7E",
  authDomain: "chatversa-ca526.firebaseapp.com",
  projectId: "chatversa-ca526",
  storageBucket: "chatversa-ca526.firebasestorage.app",
  messagingSenderId: "735371121479",
  appId: "1:735371121479:web:230385acffc8a7c3e8f262"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Elements
const chatUserName = document.getElementById("chatUserName");
const userAvatar = document.getElementById("userAvatar");
const userStatus = document.getElementById("userStatus");
const chatBox = document.getElementById("chatBox");
const messageForm = document.getElementById("messageForm");
const messageInput = document.getElementById("messageInput");
const actionBtn = document.getElementById("actionBtn");

// Plus & Inputs
const plusBtn = document.getElementById("plusBtn");
const plusMenu = document.getElementById("plusMenu");
const pictureInput = document.getElementById("pictureInput");
const documentInput = document.getElementById("documentInput");
const cameraBtn = document.getElementById("cameraBtn");

// Camera Overlay Elements
const cameraOverlay = document.getElementById("cameraOverlay");
const cameraFeed = document.getElementById("cameraFeed");
const capturedCanvas = document.getElementById("capturedCanvas");
const shutterBtn = document.getElementById("shutterBtn");
const closeCamBtn = document.getElementById("closeCamBtn");
const sendSnapBtn = document.getElementById("sendSnapBtn");
const viewModeSelector = document.getElementById("viewModeSelector");

// Snap Viewer Elements
const snapViewerOverlay = document.getElementById("snapViewerOverlay");
const snapImageViewer = document.getElementById("snapImageViewer");
const snapTimerBadge = document.getElementById("snapTimerBadge");

// Call Modal Elements
const callModal = document.getElementById("callModal");
const callBgBlur = document.getElementById("callBgBlur");
const callUserAvatar = document.getElementById("callUserAvatar");
const callUserName = document.getElementById("callUserName");
const callStatusLabel = document.getElementById("callStatusLabel");
const callTimer = document.getElementById("callTimer");
const videoContainer = document.getElementById("videoContainer");

const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");
const endCallBtn = document.getElementById("endCallBtn");
const acceptCallBtn = document.getElementById("acceptCallBtn");
const toggleMicBtn = document.getElementById("toggleMicBtn");
const toggleCamBtn = document.getElementById("toggleCamBtn");

const urlParams = new URLSearchParams(window.location.search);
let roomId = urlParams.get("roomId");
let friendName = urlParams.get("name");
let targetUid = urlParams.get("userId");

let currentUser = null;
let peerConnection = null;
let localStream = null;
let cameraStream = null;
let capturedSnapData = null;
let selectedViewLimit = 1;

const rtcConfig = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.1.google.com:19302" }
  ]
};

function getConsistentRoomId(uid1, uid2) {
    return [uid1, uid2].sort().join("_");
}

onAuthStateChanged(auth, async (user) => {
    if (!user) {
        location.href = "index.html";
        return;
    }
    currentUser = user;

    if (targetUid) {
        roomId = getConsistentRoomId(currentUser.uid, targetUid);
    } else if (roomId) {
        const uids = roomId.split("_");
        targetUid = uids.find(id => id !== currentUser.uid);
        roomId = getConsistentRoomId(currentUser.uid, targetUid);
    }

    setupUserPresence();
    resolveUserAndPresence();
    listenForMessages();
    listenForIncomingCalls();
});

// Dynamic Mic / Send Toggle
messageInput.addEventListener("input", () => {
    if (messageInput.value.trim().length > 0) {
        actionBtn.innerText = "✈️";
        actionBtn.classList.add("is-typing");
    } else {
        actionBtn.innerText = "🎤";
        actionBtn.classList.remove("is-typing");
    }
});

// Plus Menu Toggle
plusBtn.onclick = (e) => {
    e.stopPropagation();
    plusMenu.style.display = plusMenu.style.display === "flex" ? "none" : "flex";
};

document.onclick = () => {
    plusMenu.style.display = "none";
};

// Option 1: Emoji
document.getElementById("optionEmoji").onclick = () => {
    messageInput.value += "😊 ";
    messageInput.dispatchEvent(new Event('input'));
    messageInput.focus();
};

// Option 2: Pictures
document.getElementById("optionPicture").onclick = () => pictureInput.click();

pictureInput.onchange = (e) => {
    const file = e.target.files[0];
    if (file && roomId) {
        const reader = new FileReader();
        reader.onload = async function(event) {
            await addDoc(collection(db, "chatRooms", roomId, "messages"), {
                imageUrl: event.target.result,
                senderId: currentUser.uid,
                timestamp: serverTimestamp()
            });
        };
        reader.readAsDataURL(file);
    }
};

// Option 3: FIX FOR DOCUMENTS
document.getElementById("optionDocument").onclick = () => documentInput.click();

documentInput.onchange = (e) => {
    const file = e.target.files[0];
    if (file && roomId) {
        const reader = new FileReader();
        reader.onload = async function(event) {
            await addDoc(collection(db, "chatRooms", roomId, "messages"), {
                fileUrl: event.target.result,
                fileName: file.name,
                isDocument: true,
                senderId: currentUser.uid,
                timestamp: serverTimestamp()
            });
        };
        reader.readAsDataURL(file);
    }
};

// Option 4: FIX FOR LOCATION
document.getElementById("optionLocation").onclick = () => {
    if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(async (position) => {
            const locUrl = `https://www.google.com/maps?q=${position.coords.latitude},${position.coords.longitude}`;
            await addDoc(collection(db, "chatRooms", roomId, "messages"), {
                text: `📍 My Live Location: ${locUrl}`,
                isLocation: true,
                locUrl: locUrl,
                senderId: currentUser.uid,
                timestamp: serverTimestamp()
            });
        }, (err) => {
            alert("Could not retrieve location. Please turn on GPS permissions.");
        });
    } else {
        alert("Geolocation not supported on this browser.");
    }
};

// REAL CAMERA STREAM FOR SNAP
cameraBtn.onclick = async () => {
    try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
        cameraFeed.srcObject = cameraStream;
        cameraOverlay.style.display = "flex";
        cameraFeed.style.display = "block";
        capturedCanvas.style.display = "none";
        shutterBtn.style.display = "block";
        sendSnapBtn.style.display = "none";
        viewModeSelector.style.display = "none";
    } catch (e) {
        alert("Camera permission denied or camera not found.");
    }
};

closeCamBtn.onclick = () => {
    if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
    cameraOverlay.style.display = "none";
};

shutterBtn.onclick = () => {
    const ctx = capturedCanvas.getContext('2d');
    capturedCanvas.width = cameraFeed.videoWidth;
    capturedCanvas.height = cameraFeed.videoHeight;
    ctx.drawImage(cameraFeed, 0, 0);
    capturedSnapData = capturedCanvas.toDataURL('image/jpeg');

    if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
    cameraFeed.style.display = "none";
    capturedCanvas.style.display = "block";
    shutterBtn.style.display = "none";
    sendSnapBtn.style.display = "block";
    viewModeSelector.style.display = "flex";
};

window.selectLimit = (num) => {
    selectedViewLimit = num;
    document.getElementById('chip1x').classList.toggle('active', num === 1);
    document.getElementById('chip2x').classList.toggle('active', num === 2);
};

sendSnapBtn.onclick = async () => {
    if (capturedSnapData && roomId) {
        await addDoc(collection(db, "chatRooms", roomId, "messages"), {
            snapUrl: capturedSnapData,
            senderId: currentUser.uid,
            isSnap: true,
            viewsLeft: selectedViewLimit,
            maxViews: selectedViewLimit,
            timestamp: serverTimestamp()
        });
        cameraOverlay.style.display = "none";
    }
};

// Presence & Resolve
function setupUserPresence() {
    const userRef = doc(db, "users", currentUser.uid);
    updateDoc(userRef, { isOnline: true, lastSeen: serverTimestamp() }).catch(() => {});
}

function resolveUserAndPresence() {
    if (friendName) {
        chatUserName.innerText = friendName;
        callUserName.innerText = friendName;
        const avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(friendName)}&background=6366f1&color=fff`;
        userAvatar.src = avatarUrl;
        callUserAvatar.src = avatarUrl;
        callBgBlur.style.backgroundImage = `url(${avatarUrl})`;
    }

    if (targetUid) {
        onSnapshot(doc(db, "users", targetUid), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                const name = data.username || friendName || "User";
                chatUserName.innerText = name;
                callUserName.innerText = name;

                const avatar = data.photoURL || data.profilePic || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=6366f1&color=fff`;
                userAvatar.src = avatar;
                callUserAvatar.src = avatar;

                if (data.isOnline) {
                    userStatus.innerText = "Online";
                    userStatus.className = "status-text status-online";
                } else {
                    userStatus.innerText = "Offline";
                    userStatus.className = "status-text";
                }
            }
        });
    }
}

// Chat Listener
function listenForMessages() {
    if (!roomId) return;
    const q = query(
        collection(db, "chatRooms", roomId, "messages"),
        orderBy("timestamp", "asc")
    );

    onSnapshot(q, (snapshot) => {
        chatBox.innerHTML = "";
        snapshot.forEach((docSnap) => {
            const msgId = docSnap.id;
            const msg = docSnap.data();
            const isMe = msg.senderId === currentUser.uid;
            const msgDiv = document.createElement("div");

            if (msg.isSnap) {
                msgDiv.classList.add("message", isMe ? "my-msg" : "other-msg");
                msgDiv.style.padding = "6px";

                if (msg.viewsLeft <= 0) {
                    msgDiv.innerHTML = `<span style="font-size:13px; color:#94a3b8; font-style:italic;">🔥 Opened Snap</span>`;
                } else if (isMe) {
                    msgDiv.innerHTML = `<span style="font-size:13px; color:#c7d2fe;">🔥 Sent Snap (${msg.maxViews}x View)</span>`;
                } else {
                    const snapBtn = document.createElement("button");
                    snapBtn.className = "snap-msg-btn";
                    snapBtn.innerHTML = `🔥 View Snap (${msg.viewsLeft} Left)`;
                    snapBtn.onclick = async () => {
                        snapImageViewer.src = msg.snapUrl;
                        snapViewerOverlay.style.display = "flex";

                        let newViews = msg.viewsLeft - 1;
                        await updateDoc(doc(db, "chatRooms", roomId, "messages", msgId), {
                            viewsLeft: newViews,
                            snapUrl: newViews <= 0 ? "" : msg.snapUrl
                        });

                        let timeLeft = 5;
                        snapTimerBadge.innerText = `${timeLeft}s`;
                        let countdown = setInterval(() => {
                            timeLeft--;
                            snapTimerBadge.innerText = `${timeLeft}s`;
                            if (timeLeft <= 0) {
                                clearInterval(countdown);
                                snapViewerOverlay.style.display = "none";
                                snapImageViewer.src = "";
                                if (newViews <= 0) {
                                    deleteDoc(doc(db, "chatRooms", roomId, "messages", msgId)).catch(() => {});
                                }
                            }
                        }, 1000);
                    };
                    msgDiv.appendChild(snapBtn);
                }
            } else if (msg.isDocument) {
                msgDiv.classList.add("message", isMe ? "my-msg" : "other-msg");
                msgDiv.innerHTML = `📄 <a href="${msg.fileUrl}" download="${msg.fileName}" style="color:white; text-decoration:underline;">${msg.fileName}</a>`;
            } else if (msg.isLocation) {
                msgDiv.classList.add("message", isMe ? "my-msg" : "other-msg");
                msgDiv.innerHTML = `📍 <a href="${msg.locUrl}" target="_blank" style="color:white; text-decoration:underline;">View Shared Location</a>`;
            } else if (msg.imageUrl) {
                msgDiv.classList.add("message", isMe ? "my-msg" : "other-msg");
                msgDiv.style.padding = "6px";
                const img = document.createElement("img");
                img.src = msg.imageUrl;
                img.style.maxWidth = "220px";
                img.style.borderRadius = "14px";
                img.style.display = "block";
                msgDiv.appendChild(img);
            } else {
                msgDiv.classList.add("message", isMe ? "my-msg" : "other-msg");
                msgDiv.innerText = msg.text || "";
            }

            chatBox.appendChild(msgDiv);
        });
        chatBox.scrollTop = chatBox.scrollHeight;
    });
}

messageForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = messageInput.value.trim();
    if (!roomId) return;

    if (text.length > 0) {
        messageInput.value = "";
        actionBtn.innerText = "🎤";
        actionBtn.classList.remove("is-typing");
        await addDoc(collection(db, "chatRooms", roomId, "messages"), {
            text: text,
            senderId: currentUser.uid,
            timestamp: serverTimestamp()
        });
    }
});

// Audio/Video Call System
document.getElementById("audioCallBtn").onclick = () => startCall(false);
document.getElementById("videoCallBtn").onclick = () => startCall(true);

async function startCall(isVideo) {
    if (!roomId) return;
    try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true });
    } catch (err) {
        alert("Microphone/Camera permissions required.");
        return;
    }

    callModal.style.display = "flex";
    callStatusLabel.innerText = "Calling...";
    localVideo.srcObject = localStream;

    peerConnection = new RTCPeerConnection(rtcConfig);
    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

    peerConnection.ontrack = (event) => {
        remoteVideo.srcObject = event.streams[0];
    };

    const callDocRef = doc(db, "chatRooms", roomId, "calls", "currentCall");
    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);

    await setDoc(callDocRef, {
        offer: { type: offer.type, sdp: offer.sdp },
        callerId: currentUser.uid,
        type: isVideo ? "video" : "audio",
        status: "calling"
    });
}

function listenForIncomingCalls() {
    if (!roomId) return;
    const callDocRef = doc(db, "chatRooms", roomId, "calls", "currentCall");

    onSnapshot(callDocRef, async (snapshot) => {
        if (!snapshot.exists()) return;
        const data = snapshot.data();

        if (data.callerId !== currentUser.uid && data.status === "calling") {
            callModal.style.display = "flex";
            callStatusLabel.innerText = `Incoming Call...`;
            acceptCallBtn.style.display = "flex";

            acceptCallBtn.onclick = async () => {
                acceptCallBtn.style.display = "none";
                localStream = await navigator.mediaDevices.getUserMedia({ video: data.type === "video", audio: true });
                localVideo.srcObject = localStream;

                peerConnection = new RTCPeerConnection(rtcConfig);
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                peerConnection.ontrack = (event) => {
                    remoteVideo.srcObject = event.streams[0];
                };

                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                await updateDoc(callDocRef, {
                    answer: { type: answer.type, sdp: answer.sdp },
                    status: "connected"
                });
            };
        } else if (data.status === "ended") {
            callModal.style.display = "none";
        }
    });
}

endCallBtn.onclick = async () => {
    if (roomId) {
        const callDocRef = doc(db, "chatRooms", roomId, "calls", "currentCall");
        await setDoc(callDocRef, { status: "ended" }, { merge: true }).catch(() => {});
    }
    callModal.style.display = "none";
};
