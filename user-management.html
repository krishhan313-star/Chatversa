<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Management</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

header{
    background:#4f46e5;
    color:#fff;
    padding:18px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.container{
    padding:20px;
}

.search-box{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    box-sizing:border-box;
    margin-bottom:20px;
}

.user-card{
    background:#fff;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.user-card h3{
    margin:0 0 8px;
}

.info{
    color:#555;
    margin:5px 0;
}

.btn{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    color:white;
    font-size:15px;
    cursor:pointer;
    margin-top:8px;
}

.warning{
    background:#f59e0b;
}

.ban{
    background:#ef4444;
}

.back{
    background:#4f46e5;
    margin-top:20px;
}
</style>
</head>

<body>

<header>
👥 User Management
</header>

<div class="container">

 <input
type="text"
id="searchUser"
class="search-box"
placeholder="🔍 Search user by email..."
onkeyup="searchUser()">

 <div id="userList"></div>

<button
class="btn back"
onclick="window.location.href='admin.html'">

⬅ Back to Admin Panel

</button>

</div>
  <script type="module" src="user-management.js"></script>
</body>
</html>
