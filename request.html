<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Section - Chatversa</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
}

.header{
background:#1e293b;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
box-shadow:0 5px 15px rgba(0,0,0,.35);
}

.container{
padding:20px;
}

.request-card{
background:#1e293b;
padding:18px;
border-radius:16px;
margin-bottom:15px;
box-shadow:0 5px 15px rgba(0,0,0,.25);
}

.user-name{
font-size:18px;
font-weight:bold;
margin-bottom:10px;
}

.status{
color:#94a3b8;
font-size:14px;
margin-bottom:15px;
}

.btn-row{
display:flex;
gap:10px;
}

.accept-btn{
flex:1;
background:#16a34a;
border:none;
padding:12px;
border-radius:10px;
color:white;
font-weight:bold;
cursor:pointer;
}

.reject-btn{
flex:1;
background:#dc2626;
border:none;
padding:12px;
border-radius:10px;
color:white;
font-weight:bold;
cursor:pointer;
}

.back-btn{
width:100%;
margin-top:20px;
padding:14px;
border:none;
border-radius:12px;
background:#4f46e5;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}
.tabs{
display:flex;
gap:10px;
margin-bottom:20px;
}

.tab-btn{
flex:1;
padding:12px;
border:none;
border-radius:10px;
background:#334155;
color:white;
font-weight:bold;
cursor:pointer;
}

.active{
background:#4f46e5;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
margin-bottom:15px;
outline:none;
}
</style>

</head>

<body>

<div class="header">
📩 Request Section
</div>

<div class="container">

<!-- Tabs -->

<div class="tabs">

<button class="tab-btn active" onclick="showTab('search')">
🔍 Search
</button>

<button class="tab-btn" onclick="showTab('received')">
📥 Received
</button>

<button class="tab-btn" onclick="showTab('sent')">
📤 Sent
</button>

</div>

<!-- Search -->

<div id="searchTab">

<input
type="text"
id="searchUser"
placeholder="Search username...">

<div id="searchList">

</div>

</div>

<!-- Received -->

<div id="receivedTab" style="display:none;">

<div id="requestList">

</div>

</div>

<!-- Sent -->

<div id="sentTab" style="display:none;">

<div id="sentRequestList">

</div>

</div>

<button
class="back-btn"
onclick="location.href='chat.html'">

🏠 Back

</button>

</div>

</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

 import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc,
  updateDoc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyDe3ahkE9wEpUOYwt8dnUiFhUAYI1X3i7E",
  authDomain: "chatversa-ca526.firebaseapp.com",
  projectId: "chatversa-ca526",
  storageBucket: "chatversa-ca526.firebasestorage.app",
  messagingSenderId: "735371121479",
  appId: "1:735371121479:web:230385acffc8a7c3e8f262"

};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const requestList = document.getElementById("requestList");

let currentUser = null;

onAuthStateChanged(auth, (user) => {

    if (!user) {
        location.href = "index.html";
        return;
    }

    currentUser = user;

    loadRequests();

});

async function loadRequests(){

    requestList.innerHTML = "";

    const snapshot = await getDocs(collection(db,"requests"));

    let found = false;
        snapshot.forEach(async (requestDoc)=>{

        const request = requestDoc.data();

         if(
    request.receiverId !== currentUser.uid ||
    request.status !== "pending"
) return;

        found = true;

          const senderRef = doc(db, "users", request.senderId);
const senderSnap = await getDoc(senderRef);

let senderName = "Unknown User";

if (senderSnap.exists()) {
    const senderData = senderSnap.data();
    senderName = senderData.username || senderData.email.split("@")[0];
}
        requestList.innerHTML += `

        <div class="request-card">

             <h2>👤 ${senderName}</h2>

            <div class="status">
                Wants to chat with you.
            </div>

            <div class="btn-row">

                <button
                class="accept-btn"
                onclick="acceptRequest('${requestDoc.id}')">
                ✅ Accept
                </button>

                <button
                class="reject-btn"
                onclick="rejectRequest('${requestDoc.id}')">
                ❌ Reject
                </button>

            </div>

        </div>

        `;

    });

    if(!found){

        requestList.innerHTML = `

        <div class="request-card">

            <div class="user-name">
                No Requests
            </div>

            <div class="status">
                You don't have any pending requests.
            </div>

        </div>

        `;

    }

}

 window.acceptRequest = async function(requestId){

    // Request Document
    const requestRef = doc(db, "requests", requestId);
    const requestSnap = await getDoc(requestRef);

    if(!requestSnap.exists()){
        alert("Request not found!");
        return;
    }

    const request = requestSnap.data();

    // Request Accept
    await updateDoc(requestRef,{
        status:"accepted"
    });

    // Unique Chat Room ID
    const roomId =
        request.senderId < request.receiverId
        ? request.senderId + "_" + request.receiverId
        : request.receiverId + "_" + request.senderId;

    // Chat Room Create
    await setDoc(doc(db,"chatRooms",roomId),{

        members:[
            request.senderId,
            request.receiverId
        ],

        createdAt: serverTimestamp(),

        lastMessage:"",
        lastMessageTime:null

    },{merge:true});

    alert("✅ Request Accepted");

    loadRequests();

};

window.rejectRequest = async function(id){

    await updateDoc(doc(db,"requests",id),{

        status:"rejected"

    });

    alert("❌ Request Rejected");

    loadRequests();

}
window.showTab = function(tab){

    // Sab hide
    document.getElementById("searchTab").style.display = "none";
    document.getElementById("receivedTab").style.display = "none";
    document.getElementById("sentTab").style.display = "none";

    // Active button remove
    document.querySelectorAll(".tab-btn").forEach(btn=>{
        btn.classList.remove("active");
    });

    // Selected tab show
    if(tab==="search"){
        document.getElementById("searchTab").style.display="block";
        document.querySelectorAll(".tab-btn")[0].classList.add("active");
    }

    if(tab==="received"){
        document.getElementById("receivedTab").style.display="block";
        document.querySelectorAll(".tab-btn")[1].classList.add("active");
    }

    if(tab==="sent"){
        document.getElementById("sentTab").style.display="block";
        document.querySelectorAll(".tab-btn")[2].classList.add("active");
    }

};
</script>

</body>
</html>
