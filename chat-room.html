<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Room - Chatversa</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body{
  background:#0f172a;
  color:white;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* Header */
.header{
  background:#1e293b;
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 4px 12px rgba(0,0,0,.35);
  z-index:10;
}

.user-info{
  display:flex;
  align-items:center;
  gap:12px;
}

.back-icon{
  font-size:22px;
  cursor:pointer;
  text-decoration:none;
  color:white;
  font-weight:bold;
}

.profile-pic {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  object-fit: cover;
  background: #334155;
  border: 1.5px solid #6366f1;
}

.user-details {
  display: flex;
  flex-direction: column;
}

.user-title{
  font-size:16px;
  font-weight:bold;
}

.status-text{
  font-size:12px;
  color:#94a3b8;
}

.status-online{
  color:#22c55e;
}

.call-actions{
  display:flex;
  gap:12px;
}

.call-btn{
  background:transparent;
  border:none;
  color:white;
  cursor:pointer;
  font-size:20px;
  padding:6px;
  transition:0.2s;
}

.call-btn:hover{
  opacity:0.8;
}

/* Chat Messages */
.chat-box{
  flex:1;
  padding:20px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.message{
  max-width:75%;
  padding:12px 16px;
  border-radius:18px;
  font-size:15px;
  line-height:1.4;
  word-wrap:break-word;
}

.my-msg{
  align-self:flex-end;
  background:#6366f1;
  color:white;
  border-bottom-right-radius:4px;
}

.other-msg{
  align-self:flex-start;
  background:#1e293b;
  color:#e2e8f0;
  border-bottom-left-radius:4px;
}

.call-log-msg {
  align-self: center !important;
  background: #334155 !important;
  color: #cbd5e1 !important;
  font-size: 13px !important;
  border-radius: 12px !important;
  padding: 6px 14px !important;
  text-align: center;
}

.input-container{
  background:#1e293b;
  padding:12px 16px;
  display:flex;
  gap:10px;
  align-items:center;
}

.message-input{
  flex:1;
  padding:12px 18px;
  border:none;
  border-radius:24px;
  background:#0f172a;
  color:white;
  font-size:15px;
  outline:none;
}

.send-btn{
  background:#6366f1;
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:24px;
  font-weight:bold;
  cursor:pointer;
}

/* INSTAGRAM STYLE CALL MODAL OVERLAY */
.call-modal{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  background:#0a0a0c;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  z-index:9999;
  padding:50px 20px 40px;
}

.call-bg-blur {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  filter: blur(40px) brightness(0.3);
  z-index: 1;
}

.call-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

.call-avatar-wrapper {
  position: relative;
  margin-top: 30px;
}

.call-avatar {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid rgba(255,255,255,0.2);
  z-index: 2;
  position: relative;
}

.pulse-ring {
  position: absolute;
  top: -10px;
  left: -10px;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  border: 2px solid #6366f1;
  animation: pulse 1.8s infinite ease-out;
  z-index: 1;
}

@keyframes pulse {
  0% { transform: scale(0.9); opacity: 0.8; }
  100% { transform: scale(1.4); opacity: 0; }
}

.call-user-name {
  font-size: 24px;
  font-weight: 700;
  margin-top: 20px;
}

.call-status-label {
  font-size: 14px;
  color: #a1a1aa;
  margin-top: 6px;
}

.call-timer {
  font-size: 14px;
  color: #22c55e;
  margin-top: 6px;
  font-weight: 600;
  display: none;
}

/* Video Grid */
.video-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  display: none;
}

#remoteVideo {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#localVideo {
  position: absolute;
  top: 40px;
  right: 20px;
  width: 110px;
  height: 160px;
  border-radius: 16px;
  object-fit: cover;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.2);
  z-index: 3;
}

/* Controls Toolbar */
.call-controls {
  position: relative;
  z-index: 5;
  display: flex;
  gap: 20px;
  align-items: center;
  background: rgba(255, 255, 255, 0.1);
  padding: 12px 28px;
  border-radius: 40px;
  backdrop-filter: blur(20px);
}

.icon-btn {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: none;
  background: rgba(255, 255, 255, 0.2);
  color: white;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.2s;
}

.icon-btn.off {
  background: #ffffff;
  color: #000;
}

.btn-end {
  background: #ef4444 !important;
  color: white !important;
}

.btn-accept {
  background: #22c55e !important;
  color: white !important;
}
</style>
</head>

<body>

<!-- Header -->
<div class="header">
  <div class="user-info">
    <a href="javascript:history.back()" class="back-icon">←</a>
    <img id="userAvatar" class="profile-pic" src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff" alt="Profile">
    <div class="user-details">
      <div class="user-title" id="chatUserName">Loading...</div>
      <div class="status-text" id="userStatus">Offline</div>
    </div>
  </div>
  <div class="call-actions">
    <button class="call-btn" id="audioCallBtn">📞</button>
    <button class="call-btn" id="videoCallBtn">📹</button>
  </div>
</div>

<!-- Chat Messages Area -->
<div class="chat-box" id="chatBox"></div>

<!-- Input Form Section -->
<form id="messageForm" class="input-container">
  <input type="text" id="messageInput" class="message-input" placeholder="Message..." autocomplete="off" required>
  <button type="submit" class="send-btn">Send</button>
</form>

<!-- INSTAGRAM-LIKE CALL MODAL -->
<div class="call-modal" id="callModal">
  <div class="call-bg-blur" id="callBgBlur"></div>

  <!-- Video Layers -->
  <div class="video-container" id="videoContainer">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
  </div>

  <!-- Audio / Initial View -->
  <div class="call-content" id="callContent">
    <div class="call-avatar-wrapper">
      <div class="pulse-ring" id="pulseRing"></div>
      <img id="callUserAvatar" class="call-avatar" src="https://ui-avatars.com/api/?name=User" alt="Avatar">
    </div>
    <div class="call-user-name" id="callUserName">User</div>
    <div class="call-status-label" id="callStatusLabel">Ringing...</div>
    <div class="call-timer" id="callTimer">00:00</div>
  </div>

  <!-- Toolbar -->
  <div class="call-controls">
    <button class="icon-btn" id="toggleMicBtn">🎙️</button>
    <button class="icon-btn btn-accept" id="acceptCallBtn" style="display:none;">📞</button>
    <button class="icon-btn" id="toggleCamBtn" style="display:none;">📹</button>
    <button class="icon-btn btn-end" id="endCallBtn">❌</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {
  getFirestore,
  collection,
  doc,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  updateDoc,
  setDoc,
  deleteDoc,
  getDocs,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDe3ahkE9wEpUOYwt8dnUiFhUAYI1X3i7E",
  authDomain: "chatversa-ca526.firebaseapp.com",
  projectId: "chatversa-ca526",
  storageBucket: "chatversa-ca526.firebasestorage.app",
  messagingSenderId: "735371121479",
  appId: "1:735371121479:web:230385acffc8a7c3e8f262"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// DOM Elements
const chatUserName = document.getElementById("chatUserName");
const userAvatar = document.getElementById("userAvatar");
const userStatus = document.getElementById("userStatus");
const chatBox = document.getElementById("chatBox");
const messageForm = document.getElementById("messageForm");
const messageInput = document.getElementById("messageInput");

// Call Modal Elements
const callModal = document.getElementById("callModal");
const callBgBlur = document.getElementById("callBgBlur");
const callUserAvatar = document.getElementById("callUserAvatar");
const callUserName = document.getElementById("callUserName");
const callStatusLabel = document.getElementById("callStatusLabel");
const callTimer = document.getElementById("callTimer");
const videoContainer = document.getElementById("videoContainer");
const pulseRing = document.getElementById("pulseRing");

const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");
const endCallBtn = document.getElementById("endCallBtn");
const acceptCallBtn = document.getElementById("acceptCallBtn");
const toggleMicBtn = document.getElementById("toggleMicBtn");
const toggleCamBtn = document.getElementById("toggleCamBtn");

const urlParams = new URLSearchParams(window.location.search);
let roomId = urlParams.get("roomId");
let friendName = urlParams.get("name");
let targetUid = urlParams.get("userId");

let currentUser = null;
let peerConnection = null;
let localStream = null;
let timerInterval = null;
let callDurationSeconds = 0;
let audioContext = null;
let ringtoneOscillator = null;

const rtcConfig = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" }
  ]
};

function getConsistentRoomId(uid1, uid2) {
    return [uid1, uid2].sort().join("_");
}

onAuthStateChanged(auth, async (user) => {
    if (!user) {
        location.href = "index.html";
        return;
    }
    currentUser = user;

    if (targetUid) {
        roomId = getConsistentRoomId(currentUser.uid, targetUid);
    } else if (roomId) {
        const uids = roomId.split("_");
        targetUid = uids.find(id => id !== currentUser.uid);
        roomId = getConsistentRoomId(currentUser.uid, targetUid);
    }

    setupUserPresence();
    resolveUserAndPresence();
    listenForMessages();
    listenForIncomingCalls();
});

// Presence System
function setupUserPresence() {
    const userRef = doc(db, "users", currentUser.uid);
    updateDoc(userRef, { isOnline: true, lastSeen: serverTimestamp() }).catch(() => {});
    window.addEventListener("beforeunload", () => {
        updateDoc(userRef, { isOnline: false, lastSeen: serverTimestamp() });
    });
}

function resolveUserAndPresence() {
    if (friendName) {
        chatUserName.innerText = friendName;
        callUserName.innerText = friendName;
        const avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(friendName)}&background=6366f1&color=fff`;
        userAvatar.src = avatarUrl;
        callUserAvatar.src = avatarUrl;
        callBgBlur.style.backgroundImage = `url(${avatarUrl})`;
    }

    if (targetUid) {
        onSnapshot(doc(db, "users", targetUid), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                const name = data.username || friendName || "User";
                chatUserName.innerText = name;
                callUserName.innerText = name;

                const avatar = data.photoURL || data.profilePic || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=6366f1&color=fff`;
                userAvatar.src = avatar;
                callUserAvatar.src = avatar;
                callBgBlur.style.backgroundImage = `url(${avatar})`;

                if (data.isOnline) {
                    userStatus.innerText = "Online";
                    userStatus.className = "status-text status-online";
                } else if (data.lastSeen) {
                    const date = data.lastSeen.toDate ? data.lastSeen.toDate() : new Date();
                    userStatus.innerText = `Last seen at ${date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
                    userStatus.className = "status-text";
                } else {
                    userStatus.innerText = "Offline";
                    userStatus.className = "status-text";
                }
            }
        });
    }
}

// Chat System with Call Log UI
function listenForMessages() {
    if (!roomId) return;
    const q = query(
        collection(db, "chatRooms", roomId, "messages"),
        orderBy("timestamp", "asc")
    );

    onSnapshot(q, (snapshot) => {
        chatBox.innerHTML = "";
        snapshot.forEach((docSnap) => {
            const msg = docSnap.data();
            const isMe = msg.senderId === currentUser.uid;
            const msgDiv = document.createElement("div");

            if (msg.isCallLog) {
                msgDiv.classList.add("message", "call-log-msg");
            } else {
                msgDiv.classList.add("message", isMe ? "my-msg" : "other-msg");
            }

            msgDiv.innerText = msg.text || "";
            chatBox.appendChild(msgDiv);
        });
        chatBox.scrollTop = chatBox.scrollHeight;
    });
}

messageForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = messageInput.value.trim();
    if (!text || !roomId) return;

    messageInput.value = "";
    await addDoc(collection(db, "chatRooms", roomId, "messages"), {
        text: text,
        senderId: currentUser.uid,
        timestamp: serverTimestamp()
    });
});

// Send Call Summary Message to Chat
async function sendCallLogMessage(callType, status, durationSec = 0) {
    if (!roomId) return;

    let text = "";
    if (status === "connected") {
        let mins = Math.floor(durationSec / 60);
        let secs = durationSec % 60;
        let timeStr = `${mins < 10 ? '0' + mins : mins}:${secs < 10 ? '0' + secs : secs}`;
        text = `📞 ${callType === 'video' ? 'Video' : 'Audio'} Call ended • ${timeStr}`;
    } else {
        text = `🚫 Missed ${callType === 'video' ? 'Video' : 'Audio'} Call`;
    }

    await addDoc(collection(db, "chatRooms", roomId, "messages"), {
        text: text,
        senderId: currentUser.uid,
        isCallLog: true,
        timestamp: serverTimestamp()
    });
}

// Sound Generator (Procedural Ringtone)
function playRingtone() {
    try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        let osc = audioContext.createOscillator();
        let gain = audioContext.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, audioContext.currentTime); 
        gain.gain.setValueAtTime(0.1, audioContext.currentTime);
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.start();
        ringtoneOscillator = osc;
    } catch(e) {}
}

function stopRingtone() {
    if (ringtoneOscillator) {
        try { ringtoneOscillator.stop(); } catch(e){}
        ringtoneOscillator = null;
    }
}

// Timer Counter
function startTimer() {
    callDurationSeconds = 0;
    callTimer.style.display = "block";
    pulseRing.style.display = "none";
    
    timerInterval = setInterval(() => {
        callDurationSeconds++;
        let mins = Math.floor(callDurationSeconds / 60);
        let secs = callDurationSeconds % 60;
        callTimer.innerText = `${mins < 10 ? '0' + mins : mins}:${secs < 10 ? '0' + secs : secs}`;
    }, 1000);
}

// Call Actions
document.getElementById("audioCallBtn").onclick = () => startCall(false);
document.getElementById("videoCallBtn").onclick = () => startCall(true);

async function startCall(isVideo) {
    if (!roomId) return;

    try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true });
    } catch (err) {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
            isVideo = false;
        } catch (audioErr) {
            alert("Permissions required for microphone/camera.");
            return;
        }
    }

    callModal.style.display = "flex";
    callStatusLabel.innerText = "Calling...";
    acceptCallBtn.style.display = "none";
    toggleCamBtn.style.display = isVideo ? "flex" : "none";
    videoContainer.style.display = isVideo ? "block" : "none";

    localVideo.srcObject = localStream;
    playRingtone();

    peerConnection = new RTCPeerConnection(rtcConfig);
    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

    peerConnection.ontrack = (event) => {
        remoteVideo.srcObject = event.streams[0];
    };

    const callDocRef = doc(db, "chatRooms", roomId, "calls", "currentCall");
    const offerCandidatesRef = collection(callDocRef, "offerCandidates");
    const answerCandidatesRef = collection(callDocRef, "answerCandidates");

    const oldOffers = await getDocs(offerCandidatesRef);
    oldOffers.forEach(async (d) => await deleteDoc(d.ref));
    const oldAnswers = await getDocs(answerCandidatesRef);
    oldAnswers.forEach(async (d) => await deleteDoc(d.ref));

    peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
            addDoc(offerCandidatesRef, event.candidate.toJSON());
        }
    };

    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);

    await setDoc(callDocRef, {
        offer: { type: offer.type, sdp: offer.sdp },
        callerId: currentUser.uid,
        type: isVideo ? "video" : "audio",
        status: "calling"
    });

    onSnapshot(callDocRef, async (snapshot) => {
        const data = snapshot.data();
        if (data && data.answer && !peerConnection.currentRemoteDescription) {
            stopRingtone();
            const answer = new RTCSessionDescription(data.answer);
            await peerConnection.setRemoteDescription(answer);
            callStatusLabel.innerText = "Connected";
            startTimer();
        }
        if (!data || data.status === "ended") {
            closeCallUI();
        }
    });

    onSnapshot(answerCandidatesRef, (snapshot) => {
        snapshot.docChanges().forEach((change) => {
            if (change.type === "added") {
                peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
            }
        });
    });
}

function listenForIncomingCalls() {
    if (!roomId) return;
    const callDocRef = doc(db, "chatRooms", roomId, "calls", "currentCall");

    onSnapshot(callDocRef, async (snapshot) => {
        if (!snapshot.exists()) return;
        const data = snapshot.data();

        if (data.callerId !== currentUser.uid && data.status === "calling") {
            playRingtone();
            callModal.style.display = "flex";
            callStatusLabel.innerText = `Incoming ${data.type} call...`;
            acceptCallBtn.style.display = "flex";
            toggleCamBtn.style.display = data.type === "video" ? "flex" : "none";
            videoContainer.style.display = data.type === "video" ? "block" : "none";

            acceptCallBtn.onclick = async () => {
                stopRingtone();
                acceptCallBtn.style.display = "none";
                callStatusLabel.innerText = "Connecting...";

                try {
                    localStream = await navigator.mediaDevices.getUserMedia({
                        video: data.type === "video",
                        audio: true
                    });
                } catch (err) {
                    localStream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
                }

                localVideo.srcObject = localStream;

                peerConnection = new RTCPeerConnection(rtcConfig);
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                peerConnection.ontrack = (event) => {
                    remoteVideo.srcObject = event.streams[0];
                };

                const offerCandidatesRef = collection(callDocRef, "offerCandidates");
                const answerCandidatesRef = collection(callDocRef, "answerCandidates");

                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        addDoc(answerCandidatesRef, event.candidate.toJSON());
                    }
                };

                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                await updateDoc(callDocRef, {
                    answer: { type: answer.type, sdp: answer.sdp },
                    status: "connected"
                });

                callStatusLabel.innerText = "Connected";
                startTimer();

                onSnapshot(offerCandidatesRef, (snapshot) => {
                    snapshot.docChanges().forEach((change) => {
                        if (change.type === "added") {
                            peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
                        }
                    });
                });
            };
        } else if (data.status === "ended") {
            closeCallUI();
        }
    });
}

// Control Buttons Logic
toggleMicBtn.onclick = () => {
    if (localStream) {
        const audioTrack = localStream.getAudioTracks()[0];
        if (audioTrack) {
            audioTrack.enabled = !audioTrack.enabled;
            toggleMicBtn.classList.toggle("off", !audioTrack.enabled);
            toggleMicBtn.innerText = audioTrack.enabled ? "🎙️" : "🔇";
        }
    }
};

toggleCamBtn.onclick = () => {
    if (localStream) {
        const videoTrack = localStream.getVideoTracks()[0];
        if (videoTrack) {
            videoTrack.enabled = !videoTrack.enabled;
            toggleCamBtn.classList.toggle("off", !videoTrack.enabled);
        }
    }
};

endCallBtn.onclick = async () => {
    if (roomId) {
        const callDocRef = doc(db, "chatRooms", roomId, "calls", "currentCall");
        
        // Push Call duration log to chat box
        const isVideo = toggleCamBtn.style.display !== "none";
        if (callStatusLabel.innerText === "Connected") {
            await sendCallLogMessage(isVideo ? "video" : "audio", "connected", callDurationSeconds);
        } else {
            await sendCallLogMessage(isVideo ? "video" : "audio", "missed");
        }

        await setDoc(callDocRef, { status: "ended" }, { merge: true }).catch(() => {});
    }
    closeCallUI();
};

function closeCallUI() {
    stopRingtone();
    if (timerInterval) clearInterval(timerInterval);
    if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
    }
    if (peerConnection) {
        peerConnection.close();
    }
    callModal.style.display = "none";
    callTimer.innerText = "00:00";
    callTimer.style.display = "none";
    pulseRing.style.display = "block";
}
</script>

</body>
</html>
